name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          p12_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          KEY_PATH="$key_path" python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["KEY_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_BASE64"]))'
          P12_PATH="$p12_path" python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["P12_PATH"]).write_bytes(base64.b64decode(os.environ["CSC_LINK"]))'
          chmod 600 "$key_path" "$p12_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" -k "$keychain_path" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          # electron-builder unlocks its own keychain with the certificate password, which fails.
          # Hand it this keychain instead.
          unset CSC_LINK
          unset CSC_KEY_PASSWORD
          export APPLE_API_KEY="$key_path"
          export CSC_KEYCHAIN="$keychain_path"
          npm run dist:mac
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: usage-monitor-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          expected="Usage-Monitor-${version}-mac-arm64.dmg Usage-Monitor-${version}-mac-x64.dmg Usage-Monitor-${version}-mac-arm64.zip Usage-Monitor-${version}-mac-x64.zip Usage-Monitor-${version}-win-x64.exe Usage-Monitor-${version}-win-ia32.exe"
          missing=""
          for name in $expected; do
            if [ ! -f "release-assets/${name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing release files:${missing}"
            find release-assets -type f -print
            exit 1
          fi
          notes=$(cat <<EOF
          Install the file that matches your computer.

          - Mac with Apple silicon: \`Usage-Monitor-${version}-mac-arm64.dmg\`
          - Mac with Intel: \`Usage-Monitor-${version}-mac-x64.dmg\`
          - Windows 64-bit: \`Usage-Monitor-${version}-win-x64.exe\`
          - Windows 32-bit: \`Usage-Monitor-${version}-win-ia32.exe\`

          The zip files are the same Mac apps without a disk image.

          Mac disk images are signed with a Developer ID and notarized by Apple. Open the disk image and drag Usage Monitor into Applications. On Windows, if SmartScreen appears, choose More info, then Run anyway.
          EOF
          )
          notes=$(printf '%s\n' "$notes" | sed 's/^          //')
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/Usage-Monitor-${version}-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/Usage-Monitor-${version}-* \
              --title "Usage Monitor ${version}" \
              --notes "$notes"
          fi
